[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln"
# The version is kiln/__init__.py __version__ and nowhere else (tests/test_version.py).
dynamic = ["version"]
description = "LLM inference engine for AWS Trainium and Inferentia"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "safetensors",
  "tokenizers",
  "transformers",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.dynamic]
version = { attr = "kiln.__version__" }

[tool.setuptools.packages.find]
include = ["kiln*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
